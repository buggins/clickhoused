name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.dc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, dc: dmd-latest }
          - { os: ubuntu-latest, dc: ldc-latest }
          # Minimum supported D frontend: 2.097 (the same as ddbc)
          - { os: ubuntu-latest, dc: dmd-2.097.2 }
          - { os: ubuntu-latest, dc: ldc-1.27.1 }
          - { os: windows-latest, dc: dmd-latest }
          - { os: windows-latest, dc: ldc-latest }
          # DMD does not target arm64 macOS runners
          - { os: macos-latest, dc: ldc-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ${{ matrix.dc }}
      - name: Cache dub packages and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/.dub/cache
            ~/AppData/Local/dub/packages
            ~/AppData/Local/dub/cache
          key: dub-${{ github.job }}-${{ runner.os }}-${{ matrix.dc }}-${{ hashFiles('**/dub.json') }}
          restore-keys: dub-${{ github.job }}-${{ runner.os }}-${{ matrix.dc }}-
      - name: Build library
        run: dub build
      - name: Unit tests
        # The TLS unit tests skip when OpenSSL can't be loaded; on Linux it must load
        env:
          CLICKHOUSED_REQUIRE_OPENSSL: ${{ runner.os == 'Linux' && '1' || '' }}
        run: dub test
      - name: Integration tests (threads)
        run: dub run :integration-tests-phobos
      - name: Integration tests (vibe.d fibers)
        run: dub run :integration-tests-vibe
      - name: Build examples
        run: |
          dub build :example-basic
          dub build :example-vibe

  integration:
    name: server (ClickHouse ${{ matrix.clickhouse }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported LTS, recent LTS releases, and the latest release
        clickhouse: ["23.8", "25.8", "26.8", "latest"]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        env:
          # Allow network access for the passwordless default user
          CLICKHOUSE_SKIP_USER_SETUP: 1
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "clickhouse client -q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLICKHOUSE_HOST: localhost:9000
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ldc-latest
      - name: Cache dub packages and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/.dub/cache
            ~/AppData/Local/dub/packages
            ~/AppData/Local/dub/cache
          key: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-${{ hashFiles('**/dub.json') }}
          restore-keys: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-
      - name: Install libzstd
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - name: Server is reachable
        run: curl -sf 'http://localhost:8123/?query=SELECT%20version()'
      - name: Integration tests (threads)
        run: dub run :integration-tests-phobos
      - name: Integration tests (vibe.d fibers)
        run: dub run :integration-tests-vibe
      - name: Integration tests with vibe-core 1.x (vibe.d fibers)
        run: dub run :integration-tests-vibe1
      - name: Unit tests with ZSTD
        run: dub test --config=zstd
      - name: Integration tests, LZ4 compression (threads)
        run: dub run :integration-tests-phobos
        env:
          CLICKHOUSE_COMPRESSION: lz4
      - name: Integration tests, ZSTD compression (vibe.d fibers)
        run: dub run :integration-tests-vibe --override-config=clickhoused/zstd
        env:
          CLICKHOUSE_COMPRESSION: zstd
      - name: Run examples
        run: |
          dub run :example-basic
          dub run :example-vibe
        env:
          CLICKHOUSE_DSN: clickhouse://localhost:9000
      # A second server of the same version with TLS on port 9440, using the test
      # certificates (a service container can't mount files from the checkout)
      - name: Start a server with TLS
        run: sh integration-tests/tls/start-server.sh "${{ matrix.clickhouse }}" 19440
      - name: Integration tests over TLS (threads)
        run: dub run :integration-tests-phobos
        env:
          CLICKHOUSE_HOST: localhost:19440
          CLICKHOUSE_SECURE: 1
          CLICKHOUSE_TLS_CA: ${{ github.workspace }}/source/clickhoused/io/testdata/ca.pem
          CLICKHOUSE_TLS_DIR: ${{ github.workspace }}/source/clickhoused/io/testdata
          CLICKHOUSE_TLS_CERT_USER: cert_user
      - name: Integration tests over TLS, LZ4 compression (vibe.d fibers)
        run: dub run :integration-tests-vibe
        env:
          CLICKHOUSE_HOST: localhost:19440
          CLICKHOUSE_SECURE: 1
          CLICKHOUSE_TLS_CA: ${{ github.workspace }}/source/clickhoused/io/testdata/ca.pem
          CLICKHOUSE_TLS_DIR: ${{ github.workspace }}/source/clickhoused/io/testdata
          CLICKHOUSE_TLS_CERT_USER: cert_user
          CLICKHOUSE_COMPRESSION: lz4

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ldc-latest
      - name: Cache dub packages and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/.dub/cache
            ~/AppData/Local/dub/packages
            ~/AppData/Local/dub/cache
          key: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-${{ hashFiles('**/dub.json') }}
          restore-keys: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-
      - name: D-Scanner style check
        run: dub run -q dscanner@0.15.2 -- --styleCheck .
      - name: dfmt formatting check
        run: |
          dub run -q dfmt@0.15.2 -- --inplace $(git ls-files '*.d')
          git diff --exit-code
      - name: Documentation builds
        run: dub build -b docs
